<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Active stack probes</title>
	</head>
	<body>
		<pre id="output">Running...</pre>

		<script>
			(() => {
				const results = [];
				const oldLimit = Error.stackTraceLimit;
				Error.stackTraceLimit = 40;

				function save(probe, kind, stack) {
					stack = String(stack || "");

					results.push({
						probe,
						kind,
						pptrMarker: stack.includes("pptr:"),
						stack,
					});
				}

				function run(probe, fn) {
					const before = results.length;

					try {
						fn();

						if (results.length === before) {
							save(
								probe,
								"Completed without a captured stack",
								"",
							);
						}
					} catch (error) {
						// Preserve the actual exception from the tested implementation.
						save(
							probe,
							"Caught exception",
							error?.stack || String(error),
						);
					}
				}

				function argumentProbe(probe, value) {
					return {
						[Symbol.toPrimitive]() {
							save(
								probe,
								"Captured during argument conversion",
								new Error("Argument conversion").stack,
							);

							return value;
						},
					};
				}

				function findGetter(object, name) {
					for (
						let current = object;
						current;
						current = Object.getPrototypeOf(current)
					) {
						const descriptor = Object.getOwnPropertyDescriptor(
							current,
							name,
						);

						if (descriptor) return descriptor.get;
					}
				}

				try {
					// Capture while the API processes our argument.
					run("querySelector: conversion", () => {
						document.querySelector(
							argumentProbe("querySelector: conversion", "html"),
						);
					});

					run("createElement: conversion", () => {
						document.createElement(
							argumentProbe("createElement: conversion", "div"),
						);
					});

					// Exercise error paths in the installed implementations.
					run("querySelector: invalid selector", () => {
						document.querySelector("[");
					});

					run("querySelector: invalid receiver", () => {
						Reflect.apply(document.querySelector, {}, ["html"]);
					});

					run("Function.toString: invalid receiver", () => {
						Reflect.apply(Function.prototype.toString, {}, []);
					});

					// Exercise getter error paths without changing navigator.
					for (const name of [
						"webdriver",
						"userAgent",
						"languages",
						"plugins",
					]) {
						run("navigator." + name + ": invalid receiver", () => {
							const getter = findGetter(navigator, name);

							if (!getter) {
								save(name, "No getter found", "");
								return;
							}

							Reflect.apply(getter, {}, []);
						});
					}
				} finally {
					Error.stackTraceLimit = oldLimit;
				}

				window.activeStackResults = results;

				const text = JSON.stringify(results, null, 2);
				document.getElementById("output").textContent = text;

				// Log a string rather than an Error object.
				console.log("[active-stack-probes]\n" + text);
			})();
		</script>
	</body>
</html>
